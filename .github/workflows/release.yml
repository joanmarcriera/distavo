name: Release (Direct DMG)

# Unattended: push a tag like `v1.0.0` and this signs (Developer ID), notarizes,
# builds a notarized + stapled DMG, and publishes a GitHub Release with it.
# `workflow_dispatch` does a dry run (builds the DMG as an artifact, no Release).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                  10-char Apple Developer Team ID
#   DEVELOPER_ID_CERT_P12_BASE64   base64 of the exported "Developer ID Application" cert (.p12)
#   DEVELOPER_ID_CERT_PASSWORD     password set when exporting that .p12
#   ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8_BASE64
#                                  App Store Connect API key, used by notarytool (--key). Replaced the
#                                  Apple ID + app-specific password, which expired → HTTP 401 (v1.15.0).
# See docs/release-automation.md for how to produce each one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build and publish (e.g. v1.15.0). Empty = dry run."
        required: false
        default: ""

permissions:
  contents: write   # create the GitHub Release + upload the DMG

jobs:
  release-direct:
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Preflight — required secrets present
        run: |
          missing=()
          for s in APPLE_TEAM_ID DEVELOPER_ID_CERT_P12_BASE64 DEVELOPER_ID_CERT_PASSWORD ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [ -n "${!s:-}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]} — see docs/release-automation.md"
            exit 1
          fi
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import Developer ID signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make the temp keychain the default search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Generate project
        run: cd apple && xcodegen generate

      - name: Archive (Direct, Developer ID)
        run: |
          cd apple
          # No -xcconfig here: the Distavo target already maps Release to configs/Direct.xcconfig,
          # and a command-line xcconfig applies CODE_SIGN_ENTITLEMENTS to every target in the
          # build, including SwiftPM resource bundles (FluidAudio's) that cannot take it.
          xcodebuild -project Distavo.xcodeproj -scheme Distavo -configuration Release \
            -archivePath build/Distavo-Direct.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive

      - name: Export Developer ID app
        run: |
          cd apple
          cat > build/ExportOptions-Direct.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Distavo-Direct.xcarchive \
            -exportOptionsPlist build/ExportOptions-Direct.plist \
            -exportPath build/export

      - name: Notarize and staple the app
        run: |
          cd apple
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID")
          APP="build/export/Distavo.app"
          ditto -c -k --keepParent "$APP" build/Distavo-app.zip
          xcrun notarytool submit build/Distavo-app.zip \
            "${NOTARY_AUTH[@]}" --wait
          xcrun stapler staple "$APP"

      - name: Build, notarize and staple the DMG
        run: |
          cd apple
          NOTARY_AUTH=(--key "$RUNNER_TEMP/notary.p8" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID")
          hdiutil create -volname "Distavo" -srcfolder build/export/Distavo.app \
            -ov -format UDZO build/Distavo.dmg
          xcrun notarytool submit build/Distavo.dmg \
            "${NOTARY_AUTH[@]}" --wait
          xcrun stapler staple build/Distavo.dmg
          xcrun stapler validate build/Distavo.dmg

      - name: Verify (Gatekeeper)
        run: |
          cd apple
          codesign --verify --strict --verbose=2 build/export/Distavo.app
          spctl -a -vvv --type exec build/export/Distavo.app

      # Sparkle appcast for the Direct edition. No-ops until the EdDSA signing
      # key exists (SPARKLE_ED_PRIVATE_KEY secret), so releases before Sparkle is
      # set up are unaffected. The signed appcast.xml is attached to the Release;
      # host it at the constant SUFeedURL (https://distavo.com/appcast.xml) so the
      # in-app updater can find it. See docs/update-verification.md.
      - name: Generate + sign Sparkle appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          cd apple
          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY not set — skipping appcast (Sparkle not configured yet)."
            exit 0
          fi
          SPARKLE_VERSION=2.6.4
          curl -fsSL -o /tmp/sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p /tmp/sparkle && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle
          # The EdDSA private key is the one secret that can forge a Distavo
          # update. Create it unreadable to other users (umask BEFORE the write,
          # not chmod after) and remove it on EVERY exit path — `set -e` aborts
          # the step on a generate_appcast failure, so a trailing `rm` never runs.
          KEYFILE="$(mktemp -t sparkle_ed_priv)"
          trap 'rm -f -- "$KEYFILE"' EXIT
          (umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE")
          mkdir -p build/appcast && cp build/Distavo.dmg build/appcast/
          /tmp/sparkle/bin/generate_appcast \
            --ed-key-file "$KEYFILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            build/appcast
          echo "Generated appcast:"; cat build/appcast/appcast.xml

      - name: Upload DMG artifact (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Distavo-dmg
          path: apple/build/Distavo.dmg

      - name: Publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="apple/build/Distavo.dmg"
          # Attach the signed appcast when Sparkle is configured (see the
          # "Generate + sign Sparkle appcast" step above).
          if [ -f apple/build/appcast/appcast.xml ]; then
            assets="$assets apple/build/appcast/appcast.xml"
          fi
          gh release create "$RELEASE_TAG" $assets \
            --title "Distavo $RELEASE_TAG" --generate-notes \
          || gh release upload "$RELEASE_TAG" $assets --clobber

      # Host the signed appcast at the constant SUFeedURL (https://distavo.com/appcast.xml)
      # by running ops/publish-appcast.sh — the same guarded script used by hand
      # (refuses a wrong-version/unsigned feed, backs up, atomic rename, verifies).
      # Like the Sparkle step it no-ops until its secret exists, so nothing breaks
      # before the deploy key is set up. APPCAST_DEPLOY_SSH_KEY = private key whose
      # public half is in marc@joanmarcriera.es authorized_keys (see docs/release-automation.md).
      - name: Publish appcast to distavo.com
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPCAST_DEPLOY_SSH_KEY: ${{ secrets.APPCAST_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${APPCAST_DEPLOY_SSH_KEY:-}" ]; then
            echo "::warning::APPCAST_DEPLOY_SSH_KEY not set — appcast NOT published; run ./ops/publish-appcast.sh $RELEASE_TAG by hand."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077; printf '%s\n' "$APPCAST_DEPLOY_SSH_KEY" > ~/.ssh/appcast_deploy)
          # Pinned host key (public) — no trust-on-first-use.
          echo "joanmarcriera.es ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDADOLZ1tckioNFzGd/GZsoyEg7d80nZ+HBnWvPt6ufp" > ~/.ssh/known_hosts
          printf 'Host joanmarcriera.es\n  IdentityFile ~/.ssh/appcast_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          trap 'rm -f ~/.ssh/appcast_deploy' EXIT
          ./ops/publish-appcast.sh "$RELEASE_TAG"
