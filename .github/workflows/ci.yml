name: CI

# Development moved to self-hosted Forgejo (git.riera.co.uk); GitHub is a push
# mirror only. Manual dispatch kept as an escape hatch — do not re-enable
# push/PR triggers, they burn the Actions allowance on every mirror sync.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run DistavoCore tests
        run: cd apple/DistavoCore && swift test

      # Builds WhisperKit/SpeakerKit, so slower than the core tests — but it's
      # what catches an argmax-oss-swift API drift before a release does.
      - name: Run DistavoEmbedded tests
        run: cd apple/DistavoEmbedded && swift test

      # M10: FluidAudio is consumed with `traits: []` (spec §3) precisely to
      # avoid linking its prebuilt NemoTextProcessing.xcframework — catch a
      # dependency bump or a manifest edit that silently turns that trait back
      # on before it ships in an archive. `swift package show-traits` on our
      # own manifest lists only OUR package's traits (DistavoEmbedded declares
      # none), so the meaningful check is the resolved traits we pass TO
      # FluidAudio (`dump-package`'s `traits` array on that dependency, read
      # with jq — preinstalled on macos-latest) — `show-traits --package-id
      # fluidaudio` is run alongside purely so the log shows what trait exists
      # and would otherwise default on.
      - name: Verify NemoTextProcessing trait stays disabled
        run: |
          cd apple/DistavoEmbedded
          echo "FluidAudio's available traits (informational — this is the package's own declaration, not our resolved choice):"
          swift package show-traits --package-id fluidaudio
          echo
          echo "Traits DistavoEmbedded's manifest enables for FluidAudio:"
          traits=$(swift package dump-package | jq -c '[.dependencies[]?.sourceControl[]? | select(.identity=="fluidaudio") | .traits] | first // "MISSING"')
          echo "$traits"
          if [ "$traits" = '"MISSING"' ]; then
            echo "::error::could not find the FluidAudio dependency in DistavoEmbedded's manifest"
            exit 1
          fi
          if echo "$traits" | grep -qi "NemoTextProcessing"; then
            echo "::error::FluidAudio's traits now include NemoTextProcessing — Package.swift must keep traits: [] on that dependency (spec §3), or the archive scan gate breaks"
            exit 1
          fi

      - name: Generate Xcode project
        run: cd apple && xcodegen generate

      - name: Build all editions (unsigned)
        run: |
          cd apple
          fail=0
          # One scheme per edition: the scheme selects the target (and so the
          # linked packages and compilation conditions); passing -xcconfig to
          # the Direct scheme only relabels a Direct build, it does not test
          # the App Store or Setapp targets.
          for edition in Direct Setapp AppStore; do
            case "$edition" in
              Direct)   scheme=Distavo ;;
              Setapp)   scheme=Distavo-Setapp ;;
              AppStore) scheme=Distavo-AppStore ;;
            esac
            echo "::group::Build $edition edition ($scheme)"
            if xcodebuild -project Distavo.xcodeproj -scheme "$scheme" \
                 -configuration Debug -derivedDataPath "build/$edition" \
                 CODE_SIGNING_ALLOWED=NO build; then
              echo "$edition: OK"
            else
              echo "::error::$edition edition failed to build"; fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
